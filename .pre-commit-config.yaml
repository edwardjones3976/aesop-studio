# Repo-side copies of the Foreman's verification gates so every provider (Codex, Cursor, Antigravity) hits them
# before a commit, not only Claude's session hooks. Install once: python -m pre_commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: unittest
        name: python -m unittest (stdlib suite)
        entry: python -m unittest discover -s tests -q
        language: system
        pass_filenames: false
        files: \.py$
